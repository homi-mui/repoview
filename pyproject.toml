[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "repoview"
version = "0.7.2"
requires-python = ">=3.9,<3.12"
dependencies = [
  "Jinja2",
  "zstandard>=0.19.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra"
testpaths = ["tests"]
