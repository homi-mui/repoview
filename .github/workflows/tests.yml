name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest Jinja2 zstandard
      - name: Run tests
        run: pytest

  packaging:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          sudo apt-get update
          sudo apt-get install -y rpm
      - name: Create source archive
        run: |
          archive=$(./scripts/create-source-archive.sh)
          test -f "$archive"
      - name: Validate packaging metadata
        run: pytest tests/test_packaging.py
      - name: Render spec
        run: rpmspec -P repoview.spec >/tmp/repoview.spec
      - name: Build RPM
        run: |
          mkdir -p .rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          rpmbuild -bs \
            --define "_topdir $PWD/.rpmbuild" \
            --define "_sourcedir $PWD/dist" \
            repoview.spec
          rpmbuild -bb --nodeps \
            --define "_topdir $PWD/.rpmbuild" \
            --define "_sourcedir $PWD/dist" \
            repoview.spec
          ls -1 .rpmbuild/SRPMS .rpmbuild/RPMS/noarch
